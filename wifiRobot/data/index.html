<html>
    <head>
        <title>WiFi selection</title> 
        <meta charset="UTF-8">
    </head>

    <body>
        <div id="container">
            <div class="wrapper">
                Insert network name (SSID) <input id="SSIDInput">
            </div>
            <div class="wrapper">
                Insert network password: <input id="networkPasswordInput">
            </div>
            <div class="wrapper">
                <button id="submitButton" onclick="SubmitButtonClicked()">Submit</button>
            </div>
            <div class="wrapper">
                <p id="message"></p>
            </div>
        </div>
    </body>

    <script>
        const messageLbl =  document.getElementById("message");
        function ShowMessage(show, msg = ""){
            messageLbl.hidden = show;
            messageLbl.innerText = msg;
        }
        ShowMessage(false);

        async function SendQuery(ssid, networkPassword){
            try{
                data = {ssid: ssid, networkPassword: networkPassword}
                const query = await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const response = await query.json();
                ShowMessage(false, response.message);
            }
            catch{
                ShowMessage(false, "Cannot connect to server. Check if the robot works properly.");
            }
        }

        async function SubmitButtonClicked(){
            const ssid = document.getElementById('SSIDInput').value;
            const networkPassword = document.getElementById('networkPasswordInput').value;

            if(ssid == ""){
                ShowMessage(false, "Network name field cannot be empty");
                return;
            }

            await SendQuery(ssid, networkPassword);
        }
    </script>

    <style>
        * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        }

        body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: #f5f5f5;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        }

        #container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 340px;
        }

        .wrapper {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        }

        input {
        width: 100%;
        padding: 10px 0;
        border: none;
        border-bottom: 2px solid #ccc;
        background: transparent;
        font-size: 15px;
        outline: none;
        color: #333;
        }

        input:focus {
        border-bottom-color: #333;
        }

        button {
        padding: 12px;
        background-color: #333;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 15px;
        cursor: pointer;
        }

        button:hover {
        background-color: #555;
        }

        #error {
        font-size: 13px;
        }
    </style>
</html>
